name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            install_cmd: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
          - os: macos-latest
            install_cmd: brew update && brew install pkg-config openssl@3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: ${{ matrix.install_cmd }}

      - name: Build
        shell: bash
        run: |
          make clean
          make

      - name: Smoke test CLI
        shell: bash
        run: |
          set +e
          ./tsa_client_openssl -verify test.txt > ci-smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected verify to fail without a .tsr file"
            cat ci-smoke.log
            exit 1
          fi
          grep -Ei "token file|tsr file|timestamped|not found" ci-smoke.log
