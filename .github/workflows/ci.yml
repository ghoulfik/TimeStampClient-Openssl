name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            install_cmd: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
          - os: macos-latest
            install_cmd: |
              if ! brew list --versions pkg-config >/dev/null 2>&1; then
                brew install pkg-config
              fi
              if ! brew list --versions openssl@3 >/dev/null 2>&1; then
                brew install openssl@3
              fi

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        shell: bash
        run: ${{ matrix.install_cmd }}

      - name: Build
        shell: bash
        run: |
          make clean
          make

      - name: Smoke test CLI
        shell: bash
        run: |
          set +e
          ./tsa_client_openssl -verify test.txt > ci-smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected verify to fail without a .tsr file"
            cat ci-smoke.log
            exit 1
          fi
          echo "Smoke test passed (expected non-zero exit: $status)."
          cat ci-smoke.log
